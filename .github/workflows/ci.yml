# CI for rysh-cli-app-code.
#
# GENERATED by scripts/export-oss.sh from scripts/oss-assets/workflow-ci-app.yml
# in the private repo. Edit it there.
#
# This repository had no workflows and no tags at all, so nothing ever proved
# the exported app tree even typechecks (E-32). This is deliberately CI and not
# a release pipeline:
#
#   - the private electron-build.yml clones rysh-cli with a PAT to bundle the
#     `rysh` sidecar, and no such secret exists — or should exist — here;
#   - shipping installers means code signing and notarisation, which is a
#     product and credential decision, not an export one.
#
# So this proves the thing that can be proven without secrets: the tree
# installs, typechecks and builds on both OSes people file bugs from.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # --ignore-scripts: nothing here needs a postinstall, and an export should
      # not run third-party install hooks in CI to typecheck itself.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
